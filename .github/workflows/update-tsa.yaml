name: Upload TSA Data to MotherDuck

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6 AM UTC
  workflow_dispatch:      # Allow manual triggering

jobs:
  upload-tsa:
    runs-on: ubuntu-latest

    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run:  Rscript -e 'install.packages("remotes")'

      - name: Install awt package
        run:  Rscript -e 'remotes::install_github("alejandrohagan/awt", upgrade = "never")'

      - name: Install md package
        run:  Rscript -e 'remotes::install_github("alejandrohagan/md", upgrade = "never")'

      - name: Install R packages
        run:  Rscript -e 'install.packages(c("remotes", "devtools", "tidyverse", "polite", "rlang"))'

      - name: Import data
        run:  Rscript scripts/upload_tsa.R

